name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test suite
        run: make test
      - name: Package Dev Kit
        run: make deb
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-devkit
          path: dist/*.deb

  web:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
