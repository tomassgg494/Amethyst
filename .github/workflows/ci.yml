name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test suite
        run: make test
      - name: Package Dev Kit
        run: make deb
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-devkit
          path: dist/*.deb
